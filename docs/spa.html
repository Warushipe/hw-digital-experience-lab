<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SPA test</title>
    <link rel="stylesheet" href="./css/style.css">
    <style>
</head>

<body>

    <div id="app"></div>

    <script>

        function render(page) {

            const app = document.getElementById("app");

            if (page === "top") {

                app.innerHTML = `
                    <div class="page">
                        <p class="latin">
                            Solitarii Balnei Institutum
                        </p>

                        <h1>孤独な温泉研究所</h1>
                        
                        <p class="subtitle">
                            北関東を中心とした温泉観察記録
                        </p>
                        
                        <p class="catchcopy">
                            温泉の正確な記録ではなく、
                            温泉の記憶を記録する。
                        </p>

                        <h2>この研究所について</h2>

                        <p>
                            当研究所は管理人が実際に訪れた温泉の印象を記録する個人的な研究施設です。
                        </p>

                        <button onclick="render('map')">
                            研究対象地域を見る
                        </button>
                    </div>
                `;
            }

            if (page === "map") {

                app.innerHTML = `
                    <div class="page">
                        <h1>研究対象地域</h1>
                        
                        <ul>
                            <li><a href="#" onclick="render('tochigi')">栃木県</a></li>
                            <li><a href="#" onclick="render('gunma')" >群馬県</a></li>
                            <li><a href="#" onclick="render('yamagata')">山形県</a></li>
                        </ul>
                    </div>
                `;
            }
            if (page === "tochigi") {

                app.innerHTML = `
                    <div class="page">

                      <div class="map-container">
                      <img src="./img/tochigi.png" alt="栃木県">
                          
                            <a href="#" class="onsen nasu">
                                <span class="dot"></span>
                                <span class="label">那須温泉</span>
                            </a>
                        <br>

                        <button onclick="render('nasu')">
                            那須温泉
                        </button>

                        <br>

                        <button onclick="render('top')">
                            戻る
                        </button>

                    </div>
                `;
            }

            if (page === "gunma") {

                app.innerHTML = `
                    <div class="page">
                    <h1>群馬県</h1>
                    
                      <div class="map-container">
                      <img src="../img/gunma.png" alt="群馬県">
                          
                            <a href="#" class="onsen ikaho">
                                <span class="dot"></span>
                                <span class="label">伊香保温泉</span>
                            </a>
                    </div>

                    </div>
                `;
            }

        }

        render("top");

    </script>

</body>

</html>
